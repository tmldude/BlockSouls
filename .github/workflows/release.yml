name: release
# Two ways to release: push a v<mod_version> tag, or run this workflow on main from the Actions tab (or the API),
# which creates the tag itself (for environments that can't push tags).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/tmldude/blocksouls

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check tag matches mod_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod_version=$version in gradle.properties"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "::error::Run the release from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists: bump mod_version in gradle.properties first"
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build test
      - name: Collect jars
        run: |
          mkdir dist
          for libs in */build/libs; do
            m=${libs%%/*}; { [ "$m" = common ] || [ "$m" = integration ]; } && continue
            cp "$libs"/blocksouls-"$m"-*[0-9].jar dist/
          done

      # Our jars ride inside the .mrpack as overrides (unversioned names, so a pack update
      # overwrites them). Third-party mods are Modrinth references from modpack/mods/*.pw.toml.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build modpack
        run: |
          go install github.com/packwiz/packwiz@latest
          cd modpack
          mkdir -p mods
          for jar in ../dist/blocksouls-*.jar; do
            m=$(basename "$jar"); m=${m%%-[0-9]*}
            cp "$jar" "mods/$m.jar"
          done
          sed -i "s/^version = .*/version = \"$VERSION\"/" pack.toml
          ./add-mods.sh
          packwiz refresh
          packwiz modrinth export -o "../dist/BlockSouls-$VERSION.mrpack"

      # For hosts without Docker: our server jars + a README. Fabric API comes from Modrinth.
      - name: Build server pack
        run: |
          mkdir -p server-pack/mods
          for jar in dist/blocksouls-*.jar; do
            m=$(basename "$jar"); m=${m%%-[0-9]*}
            cp "$jar" "server-pack/mods/$m.jar"
          done
          cp docker/SERVER-PACK.md server-pack/README.md
          (cd server-pack && zip -qr "../dist/BlockSouls-$VERSION-server.zip" .)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag at this commit when the run was started by hand.
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "BlockSouls $VERSION" --generate-notes

      # Skipped unless the MODRINTH_TOKEN and MODRINTH_PROJECT_ID repo secrets are set.
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          case "$VERSION" in 0.*) type=beta ;; *) type=release ;; esac
          data=$(jq -n --arg v "$VERSION" --arg mc "$mc" --arg t "$type" --arg p "$MODRINTH_PROJECT_ID" \
            --arg log "https://github.com/${{ github.repository }}/releases/tag/$TAG" '{
              name: "BlockSouls \($v)", version_number: $v, changelog: $log, dependencies: [],
              game_versions: [$mc], version_type: $t, loaders: ["fabric"], featured: true,
              project_id: $p, file_parts: ["pack"], primary_file: "pack"
            }')
          version_id=$(curl -fsS https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: tmldude/BlockSouls release workflow" \
            -F "data=$data" \
            -F "pack=@dist/BlockSouls-$VERSION.mrpack;type=application/x-modrinth-modpack+zip" | jq -r .id)
          echo "Modrinth version $version_id"
          # Every player and the server need the pack. Uploads otherwise show "Unknown environment"; best effort, so a
          # change to Modrinth's API can't fail the release (set it by hand on the version page if this warns).
          if ! curl -fsS -X PATCH "https://api.modrinth.com/v3/version/$version_id" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: tmldude/BlockSouls release workflow" \
              -H "Content-Type: application/json" \
              -d '{"environment": "client_and_server"}'; then
            echo "::warning::Couldn't set the Modrinth environment for $version_id; set it to Client and server on the version page"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
