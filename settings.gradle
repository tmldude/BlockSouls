pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'blocksouls'

include 'common', 'movement', 'guns', 'game', 'mobs', 'world', 'vehicles', 'bosses'

// Test-only: boots every mod together (server game tests + a client game test). Never shipped.
include 'integration'
